<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Tracker — Picker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 680px; margin: 0 auto; color: #222; }
        h2 { margin-bottom: 4px; }
        .intro { color: #555; margin: 8px 0 16px; line-height: 1.5; }
        .note { background: #fff8e1; border-left: 4px solid #f5b400; padding: 12px 16px; border-radius: 4px; margin: 16px 0; line-height: 1.5; font-size: 14px; }
        .btn { background: #1a73e8; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; min-width: 240px; }
        .btn:disabled { background: #bbb; cursor: default; }
        #error { color: #EA4335; margin: 16px 0; display: none; }
        /* Files-mode checklist */
        #fileList { margin: 8px 0 16px; }
        .fileRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; }
        .fileRow.done { background: #e9f5ea; border-color: #34A853; }
        .fileName { font-family: monospace; font-size: 13px; word-break: break-all; flex: 1; }
        .fileStatus { font-size: 22px; line-height: 1; color: #34A853; width: 26px; text-align: center; }
        .selectBtn { background: #1a73e8; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .selectBtn:disabled { background: #bbb; cursor: default; }
        #progress { color: #555; font-size: 14px; margin: 8px 0 12px; }
        #finishBtn { display: none; }
    </style>
</head>
<body>
    <h2 id="heading">Leadership Tracker</h2>
    <p class="intro" id="intro"></p>

    <div class="note" id="folderWarning" style="display:none;">
        Only share this folder with the <strong>named Google accounts</strong> of your leadership team — never "Anyone with the link."
    </div>

    <!-- Folder mode: single button. -->
    <button id="go" class="btn" style="display:none;" disabled>Loading…</button>

    <!-- Files mode: per-file checklist (rendered in JS). -->
    <p id="progress" style="display:none;"></p>
    <div id="fileList"></div>
    <button id="finishBtn" class="btn">Finish</button>

    <p id="error"></p>

    <!-- clientId comes from the URL hash (hidden, pre-filled). -->
    <input id="clientId" type="hidden" />

    <script>
        // Public, referrer-restricted values (the API key only works from
        // leadershiptracker.app). 🔒 Scope LOCKED to drive.file — never widen.
        var API_KEY = 'AIzaSyCk-uLXVKMSJaEoW68CDebB8GWi86Am-t8';
        var APP_ID = '537892786449';
        var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        var APP_SCHEME = 'com.bshapiro.leadershiptracker';
        var FOLDER_MIME = 'application/vnd.google-apps.folder';

        function log(m) { console.log('[picker]', m); }

        function getHashParams() {
            var hash = window.location.hash.substring(1);
            var params = {};
            hash.split('&').forEach(function(pair) {
                var idx = pair.indexOf('=');
                if (idx > 0) { params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1)); }
            });
            return params;
        }
        function csv(s) { return (s || '').split(',').map(function(x){return x.trim();}).filter(Boolean); }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg; el.style.display = 'block';
        }

        function redirectToApp(params) {
            var query = Object.keys(params).map(function(k) {
                return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }).join('&');
            window.location.href = APP_SCHEME + '://folder?' + query;
        }

        window.addEventListener('error', function(e) { log('window error: ' + (e.message || e)); });
        window.addEventListener('unhandledrejection', function(e) { var r = e.reason; log('promise rejection: ' + (r && r.message ? r.message : JSON.stringify(r))); });

        var hashParams = getHashParams();
        var mode = hashParams.mode === 'files' ? 'files' : 'folder';
        // ⚠️ Do NOT name this `parent` — a global `var parent` clobbers
        // window.parent, which gapi's iframe RPC posts to, crashing the Picker.
        var parentFolderId = hashParams.parent || null;
        var accessToken = hashParams.token || null;
        var loginHint = hashParams.loginHint || null;
        var needNames = csv(hashParams.need);   // files to acquire (Select button)
        var haveNames = csv(hashParams.have);   // files already linked (shown ✓)
        if (hashParams.clientId) { document.getElementById('clientId').value = hashParams.clientId; }

        var pickerReady = false, gisReady = false, tokenClient = null;
        var picked = {};   // filename -> { id, name }

        // ---- token (acquired once; reused for every per-file picker open) ----
        function ensureToken(cb) {
            if (accessToken) { cb(); return; }
            var clientId = document.getElementById('clientId').value.trim();
            if (!clientId) { showError('Missing sign-in configuration. Reopen the picker from the app.'); return; }
            try {
                if (!tokenClient) {
                    var cfg = {
                        client_id: clientId,
                        scope: DRIVE_SCOPE,
                        callback: function(resp) {
                            if (resp.error) { showError('Google sign-in failed: ' + resp.error); return; }
                            accessToken = resp.access_token;
                            log('token acquired (' + (accessToken ? accessToken.length : 0) + ' chars)');
                            cb();
                        },
                        error_callback: function(err) { showError('Google sign-in was cancelled or failed. Reload to try again.'); log('GIS error_callback: ' + JSON.stringify(err)); },
                    };
                    // login_hint pre-selects the account and (when the browser
                    // carries the session) skips the chooser on every open.
                    if (loginHint) { cfg.login_hint = loginHint; }
                    tokenClient = google.accounts.oauth2.initTokenClient(cfg);
                }
                log('requesting token…' + (loginHint ? ' (login_hint set)' : ''));
                tokenClient.requestAccessToken({ prompt: '' });
            } catch (e) {
                showError('Could not start Google sign-in: ' + (e && e.message ? e.message : e));
            }
        }

        // ================= FOLDER MODE =================
        function setupFolderMode() {
            document.getElementById('heading').textContent = 'Select Your Folder';
            document.getElementById('intro').textContent = 'Choose the Google Drive folder where your unit data is stored.';
            document.getElementById('folderWarning').style.display = 'block';
            var b = document.getElementById('go');
            b.style.display = 'block';
            function enable() {
                if (!pickerReady || !gisReady) return;
                b.disabled = false; b.textContent = 'Open Folder Picker';
                b.onclick = function() { ensureToken(openFolderPicker); };
            }
            window.__enable = enable;
        }
        function openFolderPicker() {
            try {
                var view = new google.picker.DocsView().setIncludeFolders(true).setSelectFolderEnabled(true);
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action === google.picker.Action.CANCEL) { redirectToApp({ cancelled: '1' }); return; }
                        if (data.action !== google.picker.Action.PICKED) return;
                        var doc = data.docs[0];
                        if (doc && doc.mimeType === FOLDER_MIME) { redirectToApp({ id: doc.id, name: doc.name }); }
                    });
                picker.build().setVisible(true);
            } catch (e) { showError('Could not open the picker: ' + (e && e.message ? e.message : e)); }
        }

        // ================= FILES MODE (per-file checklist) =================
        function setupFilesMode() {
            document.getElementById('heading').textContent = 'Select Your Files';
            document.getElementById('intro').textContent =
                'Tap “Select” beside a file, then tap that same file in your folder. A green check appears here once it’s linked.';
            document.getElementById('progress').style.display = 'block';
            renderList();
            updateProgress();
            document.getElementById('finishBtn').onclick = finish;
            window.__enable = function() { renderList(); }; // re-enable Select buttons once ready
        }

        function ready() { return pickerReady && gisReady; }

        function renderList() {
            var list = document.getElementById('fileList');
            list.innerHTML = '';
            // Already-linked files first (informational ✓), then the ones to pick.
            haveNames.forEach(function(name) { list.appendChild(row(name, true, false)); });
            needNames.forEach(function(name) { list.appendChild(row(name, !!picked[name], true)); });
        }
        function row(name, done, actionable) {
            var div = document.createElement('div');
            div.className = 'fileRow' + (done ? ' done' : '');
            var label = document.createElement('span');
            label.className = 'fileName'; label.textContent = name;
            div.appendChild(label);
            if (done) {
                var chk = document.createElement('span');
                chk.className = 'fileStatus'; chk.textContent = '✓';
                div.appendChild(chk);
            } else if (actionable) {
                var btn = document.createElement('button');
                btn.className = 'selectBtn'; btn.textContent = 'Select';
                btn.disabled = !ready();
                btn.onclick = function() { ensureToken(function() { openFilePicker(name); }); };
                div.appendChild(btn);
            }
            return div;
        }

        function updateProgress() {
            var done = needNames.filter(function(n) { return !!picked[n]; }).length;
            var total = needNames.length;
            var p = document.getElementById('progress');
            var allDone = done >= total && total > 0;
            p.textContent = allDone
                ? 'All files linked — returning to the app…'
                : done + ' of ' + total + ' files linked' + (ready() ? '' : ' · loading Google…');
            if (allDone) {
                document.getElementById('finishBtn').style.display = 'block';
                // Auto-return shortly after the last pick (manual Finish as backup).
                setTimeout(finish, 900);
            }
        }

        function openFilePicker(name) {
            try {
                // NO setQuery — the Picker's search is GLOBAL (ignores
                // setParent) and surfaces same-named files from OTHER folders
                // (e.g. two config.json), risking linking the wrong file.
                // setParent scopes the view to ONLY the selected folder.
                var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
                    .setMimeTypes('application/json')
                    .setIncludeFolders(false).setSelectFolderEnabled(false);
                if (parentFolderId) { view.setParent(parentFolderId); }
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action !== google.picker.Action.PICKED) return; // CANCEL → stay on checklist
                        var doc = (data.docs || [])[0];
                        if (!doc) return;
                        if (doc.name !== name) {
                            showError('That was “' + doc.name + '”. Please pick “' + name + '”.');
                            return;
                        }
                        document.getElementById('error').style.display = 'none';
                        picked[name] = { id: doc.id, name: doc.name };
                        log('linked ' + name);
                        renderList();
                        updateProgress();
                    });
                picker.build().setVisible(true);
            } catch (e) { showError('Could not open the picker: ' + (e && e.message ? e.message : e)); }
        }

        function finish() {
            var files = needNames.filter(function(n){ return !!picked[n]; }).map(function(n){ return picked[n]; });
            redirectToApp({ files: JSON.stringify(files) });
        }

        // ---- bootstrap ----
        if (mode === 'files') { setupFilesMode(); } else { setupFolderMode(); }

        var s1 = document.createElement('script');
        s1.src = 'https://apis.google.com/js/api.js';
        s1.onload = function() { log('api.js loaded'); gapi.load('picker', function() { log('picker module loaded'); pickerReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); }); };
        s1.onerror = function() { showError('Failed to load Google APIs. Check your connection and try again.'); };
        document.body.appendChild(s1);

        var s2 = document.createElement('script');
        s2.src = 'https://accounts.google.com/gsi/client';
        s2.onload = function() { log('GIS loaded'); gisReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); };
        s2.onerror = function() { showError('Failed to load Google sign-in. Check your connection and try again.'); };
        document.body.appendChild(s2);

        function updateProgressSafe() { if (mode === 'files') updateProgress(); }
    </script>
</body>
</html>
