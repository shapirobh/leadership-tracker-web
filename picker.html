<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Tracker — Picker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 680px; margin: 0 auto; color: #222; }
        h2 { margin-bottom: 4px; }
        .intro { color: #555; margin: 8px 0 16px; line-height: 1.5; }
        .note { background: #fff8e1; border-left: 4px solid #f5b400; padding: 12px 16px; border-radius: 4px; margin: 16px 0; line-height: 1.5; font-size: 14px; }
        .btn { background: #1a73e8; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; min-width: 240px; }
        .btn:disabled { background: #bbb; cursor: default; }
        #error { color: #EA4335; margin: 16px 0; display: none; }
        /* Files-mode checklist */
        #fileList { margin: 8px 0 16px; }
        .fileRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; }
        .fileRow.done { background: #e9f5ea; border-color: #34A853; }
        .fileName { font-family: monospace; font-size: 13px; word-break: break-all; flex: 1; }
        .fileStatus { font-size: 22px; line-height: 1; color: #34A853; width: 26px; text-align: center; }
        .stepInstruction { font-size: 17px; line-height: 1.5; margin: 18px 0 10px; }
        .selectBtn { background: #1a73e8; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .selectBtn:disabled { background: #bbb; cursor: default; }
        #progress { color: #555; font-size: 14px; margin: 8px 0 12px; }
        #finishBtn { display: none; }
    </style>
</head>
<body>
    <h2 id="heading">Leadership Tracker</h2>
    <p class="intro" id="intro"></p>

    <div class="note" id="folderWarning" style="display:none;"></div>
    <div class="note" id="filesWhy" style="display:none;"></div>

    <!-- Folder mode: single button. -->
    <button id="go" class="btn" style="display:none;" disabled></button>

    <!-- Files mode: per-file checklist (rendered in JS). -->

    <div id="fileList"></div>
    <button id="finishBtn" class="btn"></button>
    <div class="note" id="cantFind" style="display:none;"></div>

    <p id="error"></p>

        function log(m) { console.log('[picker]', m); }

        function getHashParams() {
            var hash = window.location.hash.substring(1);
            var params = {};
            hash.split('&').forEach(function(pair) {
                var idx = pair.indexOf('=');
                if (idx > 0) { params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1)); }
            });
            return params;
        }
        function csv(s) { return (s || '').split(',').map(function(x){return x.trim();}).filter(Boolean); }

        // Reset every possible scroll root — window.scrollTo alone doesn't always
        // move the element the Picker anchors to.
        function scrollTop() {
            try {
                window.scrollTo(0, 0);
                if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
            } catch (e) { /* ignore */ }
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg; el.style.display = 'block';
        }

        function redirectToApp(params) {
            // Echo the launch nonce on EVERY return (pick / files / cancel). The
            // app ignores any deep link whose nonce doesn't match the launch it
            // started, so a forged/stale deep link from another app can't inject
            // a result. (No-op if the app didn't pass one.)
            if (nonce) { params.nonce = nonce; }
            var query = Object.keys(params).map(function(k) {
                return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }).join('&');
            window.location.href = APP_SCHEME + '://folder?' + query;
        }

        window.addEventListener('error', function(e) { log('window error: ' + (e.message || e)); });
        window.addEventListener('unhandledrejection', function(e) { var r = e.reason; log('promise rejection: ' + (r && r.message ? r.message : JSON.stringify(r))); });

        var hashParams = getHashParams();
        var mode = hashParams.mode === 'files' ? 'files' : 'folder';
        // ⚠️ Do NOT name this `parent` — a global `var parent` clobbers
        // window.parent, which gapi's iframe RPC posts to, crashing the Picker.
        var parentFolderId = hashParams.parent || null;
        var accessToken = hashParams.token || null;
        var loginHint = hashParams.loginHint || null;
        // Account mode (app builds that show the native account-confirm step):
        //   'continue' → sign in via GIS steered to loginHint (browser session
        //                matches the account; prompts only if no session)
        //   'change'   → open Google's account chooser
        //   null       → legacy: reuse the app-passed native token as-is
        var authMode = hashParams.account || null;
        var nonce = hashParams.nonce || '';   // echoed back so the app trusts only ITS launch
        var needNames = csv(hashParams.need);   // files to acquire (Select button)
        var haveNames = csv(hashParams.have);   // files already linked (shown ✓)
        if (hashParams.clientId) { document.getElementById('clientId').value = hashParams.clientId; }

        // Active language catalog (app passes lang=en|es|pt|fr; fall back to en).
        var lang = (hashParams.lang || 'en').slice(0, 2).toLowerCase();
        var L = STRINGS[lang] || STRINGS.en;

        var pickerReady = false, gisReady = false, tokenClient = null;
        var picked = {};   // filename -> { id, name }
        var browserAuthDone = false; // GIS browser sign-in completed once this page load
        var pendingCb = null;        // callback to run when the in-flight token request returns

        // ---- token: acquired ONCE per page load, then reused for every per-file
        // picker open. Re-requesting on each file was (a) showing the account
        // chooser over and over, and (b) — because the tokenClient callback is
        // bound once at creation — firing a STALE callback, which reopened the
        // Picker filtered to the FIRST file (config.json) instead of the one just
        // tapped. Acquire once, reuse; route the callback through pendingCb so it
        // always runs the LATEST request's continuation, never a stale closure.
        function ensureToken(cb) {
            // Already have a usable token → reuse it, no prompt. Legacy mode uses
            // the app-passed native token; account mode uses the token from the
            // one-time in-browser GIS sign-in (which establishes a browser session
            // for the chosen account so the Picker iframe renders as that account,
            // and works in Safari / any browser, not just an already-signed-in
            // Chrome).
            if (accessToken && (!authMode || browserAuthDone)) { cb(); return; }
            var clientId = document.getElementById('clientId').value.trim();
            if (!clientId) { showError(L.errNoConfig); return; }
            try {
                if (!tokenClient) {
                    var cfg = {
                        client_id: clientId,
                        scope: DRIVE_SCOPE,
                        callback: function(resp) {
                            if (resp.error) { showError(L.errSignIn + resp.error); return; }
                            accessToken = resp.access_token;
                            browserAuthDone = true;
                            log('token acquired (' + (accessToken ? accessToken.length : 0) + ' chars)');
                            var f = pendingCb; pendingCb = null; if (f) f();
                        },
                        error_callback: function(err) { showError(L.errCancelled); log('GIS error_callback: ' + JSON.stringify(err)); },
                    };
                    // login_hint pre-selects the account.
                    if (loginHint) { cfg.login_hint = loginHint; }
                    tokenClient = google.accounts.oauth2.initTokenClient(cfg);
                }
                // First acquisition in account mode → show Google's account chooser
                // so the user picks the account in the browser (no app-side prompt).
                // login_hint (if set) pre-highlights the app's account. After this
                // the guard above short-circuits, so it's a one-time prompt.
                pendingCb = cb;
                var req = authMode ? { prompt: 'select_account' } : {};
                log('requesting token…' + (authMode ? ' (' + authMode + ')' : '') + (loginHint ? ' login_hint' : ''));
                tokenClient.requestAccessToken(req);
            } catch (e) {
                showError(L.errStartSignIn + (e && e.message ? e.message : e));
            }
        }

        // ================= FOLDER MODE =================
        function setupFolderMode() {
            document.getElementById('heading').textContent = L.folderHeading;
            document.getElementById('intro').textContent = L.folderIntro;
            var warn = document.getElementById('folderWarning');
            warn.textContent = L.folderWarning; warn.style.display = 'block';
            var b = document.getElementById('go');
            b.textContent = L.loading;
            b.style.display = 'block';
            function enable() {
                if (!pickerReady || !gisReady) return;
                b.disabled = false; b.textContent = L.openFolder;
                b.onclick = function() { ensureToken(openFolderPicker); };
            }
            window.__enable = enable;
        }
        function openFolderPicker() {
            try {
                var view = new google.picker.DocsView().setIncludeFolders(true).setSelectFolderEnabled(true);
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action === google.picker.Action.CANCEL) { redirectToApp({ cancelled: '1' }); return; }
                        if (data.action !== google.picker.Action.PICKED) return;
                        var doc = data.docs[0];
                        if (doc && doc.mimeType === FOLDER_MIME) { redirectToApp({ id: doc.id, name: doc.name }); }
                    });
                picker.build().setVisible(true);
            } catch (e) { showError(L.errOpen + (e && e.message ? e.message : e)); }
        }

        // ============ FILES MODE (one-at-a-time guided wizard) ============
        // Walks the joiner through the files ONE at a time, entirely on this page:
        // an intro (why + Begin), then for each file "choose {name}" → opens the
        // Picker filtered to it → we validate the pick → "✓ linked, now choose {next}".
        // The Picker can surface an active/archive name pair; whichever needed file
        // they pick is accepted and the wizard advances to the next still-needed one.
        var started = false;   // intro shown until the user taps Begin
        var lastPicked = null; // the file just linked → "✓ Linked …" confirmation

        function setupFilesMode() {
            document.getElementById('heading').textContent = L.filesHeading;
            document.getElementById('intro').textContent = L.filesIntro;
            document.getElementById('progress').style.display = 'block';
            document.getElementById('finishBtn').textContent = L.finish;
            var cf = document.getElementById('cantFind');
            cf.textContent = L.cantFind; cf.style.display = 'block';
            renderStep();
            updateProgress();
            document.getElementById('finishBtn').onclick = finish;
            window.__enable = function() { renderStep(); }; // re-enable the button once Google is ready
        }

        function ready() { return pickerReady && gisReady; }

        function nextNeeded() {
            for (var i = 0; i < needNames.length; i++) { if (!picked[needNames[i]]) return needNames[i]; }
            return null;
        }

        function renderStep() {
            var list = document.getElementById('fileList');
            list.innerHTML = '';
            var why = document.getElementById('filesWhy');
            var done = needNames.filter(function(n){ return !!picked[n]; }).length;
            var total = needNames.length;

            // Intro: explain the process once, then Begin.
            if (!started) {
                why.textContent = L.filesWhy; why.style.display = 'block';
                var begin = document.createElement('button');
                begin.className = 'btn'; begin.textContent = L.begin;
                begin.disabled = !ready();
                begin.onclick = function() { started = true; renderStep(); };
                list.appendChild(begin);
                return;
            }
            why.style.display = 'none';

            // Confirm the previous pick.
            if (lastPicked) {
                var ok = document.createElement('div');
                ok.className = 'fileRow done';
                var c = document.createElement('span'); c.className = 'fileStatus'; c.textContent = '✓';
                var l = document.createElement('span'); l.className = 'fileName'; l.textContent = L.gotFile(lastPicked);
                ok.appendChild(c); ok.appendChild(l);
                list.appendChild(ok);
            }

            var current = nextNeeded();
            if (!current) return; // all linked — updateProgress() shows the done message + finishes

            var instr = document.createElement('p');
            instr.className = 'stepInstruction';
            instr.textContent = L.step(done + 1, total, current);
            list.appendChild(instr);

            var btn = document.createElement('button');
            btn.className = 'btn'; btn.textContent = L.chooseThis(current);
            btn.disabled = !ready();
            btn.onclick = function() { scrollTop(); ensureToken(function() { openFilePicker(current); }); };
            list.appendChild(btn);
        }

        function updateProgress() {
            var done = needNames.filter(function(n) { return !!picked[n]; }).length;
            var total = needNames.length;
            var p = document.getElementById('progress');
            var allDone = done >= total && total > 0;
            p.textContent = allDone
                ? L.allLinked
                : L.linked(done, total) + (ready() ? '' : L.loadingGoogle);
            if (allDone) {
                document.getElementById('finishBtn').style.display = 'block';
                // Auto-return shortly after the last pick (manual Finish as backup).
                setTimeout(finish, 900);
            }
        }

        // Record a confirmed pick (right name, right folder).
        function acceptPick(doc) {
            var nm = doc.name;
            if (needNames.indexOf(nm) === -1) { alert(L.notInList(nm)); return; }
            if (picked[nm] || haveNames.indexOf(nm) !== -1) { alert(L.alreadyLinked(nm)); return; }
            picked[nm] = { id: doc.id, name: nm };
            lastPicked = nm;
            log('linked ' + nm);
            renderStep();
            updateProgress();
        }
        function rejectWrongFolder(nm) { alert(L.wrongFolder(nm)); }
        // Confirm the picked file lives in the selected folder. Prefer the
        // Picker's parentId; if it isn't provided, verify via the Drive API
        // (the app can read a just-picked file under drive.file).
        function checkParentThenAccept(doc) {
            if (!parentFolderId) { acceptPick(doc); return; }
            if (doc.parentId) {
                if (doc.parentId === parentFolderId) acceptPick(doc); else rejectWrongFolder(doc.name);
                return;
            }
            fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(doc.id) + '?fields=parents&supportsAllDrives=true', {
                headers: { Authorization: 'Bearer ' + accessToken },
            }).then(function(r) { return r.json(); }).then(function(meta) {
                var parents = (meta && meta.parents) || [];
                if (parents.indexOf(parentFolderId) !== -1) acceptPick(doc); else rejectWrongFolder(doc.name);
            }).catch(function() { alert(L.couldNotVerify(doc.name)); }); // can't verify → fail CLOSED, don't accept
        }

        function openFilePicker(name) {
            try {
                // Reset scroll first — the Picker anchors to the scroll position
                // and its top gets clipped on a tall (scrolled) page.
                scrollTop();
                // Filter to this filename (setQuery). NOTE: the Picker search is a
                // GLOBAL, literal word "contains" — it ignores setParent and
                // operators, so the same name from another folder can appear; the
                // parent check below rejects a wrong-folder pick. LIST mode shows
                // the full filename (name only on mobile — accepted).
                var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
                    .setMimeTypes('application/json')
                    .setQuery(name)
                    .setIncludeFolders(false).setSelectFolderEnabled(false);
                if (google.picker.DocsViewMode && google.picker.DocsViewMode.LIST) {
                    view.setMode(google.picker.DocsViewMode.LIST);
                }
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action !== google.picker.Action.PICKED) return; // CANCEL → stay on checklist
                        var doc = (data.docs || [])[0];
                        if (doc) checkParentThenAccept(doc);
                    });
                picker.build().setVisible(true);
                // The Picker can re-scroll the page as it injects its overlay;
                // pin it back to the top once that settles.
                setTimeout(scrollTop, 60);
                setTimeout(scrollTop, 250);
            } catch (e) { showError(L.errOpen + (e && e.message ? e.message : e)); }
        }

        function finish() {
            var files = needNames.filter(function(n){ return !!picked[n]; }).map(function(n){ return picked[n]; });
            redirectToApp({ files: JSON.stringify(files) });
        }

        // ---- bootstrap ----
        if (mode === 'files') { setupFilesMode(); } else { setupFolderMode(); }

        var s1 = document.createElement('script');
        s1.src = 'https://apis.google.com/js/api.js';
        s1.onload = function() { log('api.js loaded'); gapi.load('picker', function() { log('picker module loaded'); pickerReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); }); };
        s1.onerror = function() { showError(L.errApis); };
        document.body.appendChild(s1);

        var s2 = document.createElement('script');
        s2.src = 'https://accounts.google.com/gsi/client';
        s2.onload = function() { log('GIS loaded'); gisReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); };
        s2.onerror = function() { showError(L.errGis); };
        document.body.appendChild(s2);

        function updateProgressSafe() { if (mode === 'files') updateProgress(); }
    </script>
</body>
</html>
