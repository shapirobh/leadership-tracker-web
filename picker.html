<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Tracker — Picker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 680px; margin: 0 auto; color: #222; }
        h2 { margin-bottom: 4px; }
        .intro { color: #555; margin: 8px 0 16px; line-height: 1.5; }
        .note { background: #fff8e1; border-left: 4px solid #f5b400; padding: 12px 16px; border-radius: 4px; margin: 16px 0; line-height: 1.5; font-size: 14px; }
        .btn { background: #1a73e8; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 8px; min-width: 240px; }
        .btn:disabled { background: #bbb; cursor: default; }
        #error { color: #EA4335; margin: 16px 0; display: none; }
        /* Files-mode checklist */
        #fileList { margin: 8px 0 16px; }
        .fileRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; }
        .fileRow.done { background: #e9f5ea; border-color: #34A853; }
        .fileName { font-family: monospace; font-size: 13px; word-break: break-all; flex: 1; }
        .fileStatus { font-size: 22px; line-height: 1; color: #34A853; width: 26px; text-align: center; }
        .selectBtn { background: #1a73e8; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .selectBtn:disabled { background: #bbb; cursor: default; }
        #progress { color: #555; font-size: 14px; margin: 8px 0 12px; }
        #finishBtn { display: none; }
    </style>
</head>
<body>
    <h2 id="heading">Leadership Tracker</h2>
    <p class="intro" id="intro"></p>

    <div class="note" id="folderWarning" style="display:none;"></div>
    <div class="note" id="filesWhy" style="display:none;"></div>

    <!-- Folder mode: single button. -->
    <button id="go" class="btn" style="display:none;" disabled></button>

    <!-- Files mode: per-file checklist (rendered in JS). -->
    <p id="progress" style="display:none;"></p>
    <div id="fileList"></div>
    <button id="finishBtn" class="btn"></button>

    <p id="error"></p>

    <!-- clientId comes from the URL hash (hidden, pre-filled). -->
    <input id="clientId" type="hidden" />

    <script>
        // Public, referrer-restricted values (the API key only works from
        // leadershiptracker.app). 🔒 Scope LOCKED to drive.file — never widen.
        var API_KEY = 'AIzaSyCk-uLXVKMSJaEoW68CDebB8GWi86Am-t8';
        var APP_ID = '537892786449';
        var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        var APP_SCHEME = 'com.bshapiro.leadershiptracker';
        var FOLDER_MIME = 'application/vnd.google-apps.folder';

        // ---- i18n: the app passes its language in the hash (lang=en|es|pt|fr).
        // These mirror the app's catalogs; keep in sync when the app copy changes.
        var STRINGS = {
            en: {
                folderHeading: 'Select Your Folder',
                folderIntro: 'Choose the Google Drive folder where your unit data is stored.',
                folderWarning: 'Only share this folder with the named Google accounts of your leadership team — never “Anyone with the link.”',
                openFolder: 'Open Folder Picker',
                loading: 'Loading…',
                filesHeading: 'Link Your Unit’s Files',
                filesIntro: 'One-time setup to connect this device to your unit’s shared data.',
                filesWhy: 'Why one file at a time? To keep your information private, Google only lets an app open files you pick yourself. So you grant this app access to each of your unit’s files once, right here — a one-time setup that takes about a minute, and you won’t have to do it again. Tap “Select” next to a file, choose it, and a green check appears. If two files share a name, pick the one inside the folder you selected.',
                select: 'Select',
                finish: 'Finish',
                linked: function (d, t) { return d + ' of ' + t + ' files linked'; },
                loadingGoogle: ' · loading Google…',
                allLinked: 'All files linked — returning to the app…',
                errApis: 'Failed to load Google APIs. Check your connection and try again.',
                errGis: 'Failed to load Google sign-in. Check your connection and try again.',
                errSignIn: 'Google sign-in failed: ',
                errNoConfig: 'Missing sign-in configuration. Reopen the picker from the app.',
                errCancelled: 'Google sign-in was cancelled or failed. Reload to try again.',
                errOpen: 'Could not open the picker: ',
                errStartSignIn: 'Could not start Google sign-in: ',
                alreadyLinked: function (n) { return '“' + n + '” is already linked.'; },
                notInList: function (n) { return '“' + n + '” isn’t one of the Leadership Tracker files.'; },
                wrongFolder: function (n) { return '“' + n + '” is in a different folder. Please pick the “' + n + '” that is inside the folder you selected.'; },
            },
            es: {
                folderHeading: 'Seleccione su carpeta',
                folderIntro: 'Elija la carpeta de Google Drive donde se guardan los datos de su unidad.',
                folderWarning: 'Comparta esta carpeta solo con las cuentas de Google de su equipo de líderes, nunca con «Cualquiera con el enlace».',
                openFolder: 'Abrir selector de carpeta',
                loading: 'Cargando…',
                filesHeading: 'Vincule los archivos de su unidad',
                filesIntro: 'Configuración única para conectar este dispositivo a los datos compartidos de su unidad.',
                filesWhy: '¿Por qué un archivo a la vez? Para mantener su información privada, Google solo permite que una aplicación abra los archivos que usted mismo elige. Por eso concede acceso a cada archivo de su unidad una vez, aquí mismo: una configuración única que toma alrededor de un minuto y que no tendrá que repetir. Toque «Seleccionar» junto a un archivo, elíjalo y aparecerá una marca verde. Si dos archivos tienen el mismo nombre, elija el que está dentro de la carpeta que seleccionó.',
                select: 'Seleccionar',
                finish: 'Finalizar',
                linked: function (d, t) { return d + ' de ' + t + ' archivos vinculados'; },
                loadingGoogle: ' · cargando Google…',
                allLinked: 'Todos los archivos vinculados: volviendo a la aplicación…',
                errApis: 'No se pudieron cargar las API de Google. Revise su conexión e inténtelo de nuevo.',
                errGis: 'No se pudo cargar el inicio de sesión de Google. Revise su conexión e inténtelo de nuevo.',
                errSignIn: 'Error al iniciar sesión en Google: ',
                errNoConfig: 'Falta la configuración de inicio de sesión. Vuelva a abrir el selector desde la aplicación.',
                errCancelled: 'El inicio de sesión de Google se canceló o falló. Vuelva a cargar para intentarlo de nuevo.',
                errOpen: 'No se pudo abrir el selector: ',
                errStartSignIn: 'No se pudo iniciar el inicio de sesión de Google: ',
                alreadyLinked: function (n) { return '«' + n + '» ya está vinculado.'; },
                notInList: function (n) { return '«' + n + '» no es uno de los archivos de Leadership Tracker.'; },
                wrongFolder: function (n) { return '«' + n + '» está en otra carpeta. Elija el «' + n + '» que está dentro de la carpeta que seleccionó.'; },
            },
            pt: {
                folderHeading: 'Selecione sua pasta',
                folderIntro: 'Escolha a pasta do Google Drive onde os dados da sua unidade ficam armazenados.',
                folderWarning: 'Compartilhe esta pasta apenas com as contas Google da sua equipe de líderes — nunca com “Qualquer pessoa com o link”.',
                openFolder: 'Abrir seletor de pasta',
                loading: 'Carregando…',
                filesHeading: 'Vincule os arquivos da sua unidade',
                filesIntro: 'Configuração única para conectar este dispositivo aos dados compartilhados da sua unidade.',
                filesWhy: 'Por que um arquivo de cada vez? Para manter suas informações privadas, o Google só permite que um aplicativo abra arquivos que você mesmo escolhe. Então você concede acesso a cada arquivo da sua unidade uma vez, aqui mesmo — uma configuração única que leva cerca de um minuto e que você não precisará repetir. Toque em “Selecionar” ao lado de um arquivo, escolha-o e uma marca verde aparecerá. Se dois arquivos tiverem o mesmo nome, escolha o que está dentro da pasta que você selecionou.',
                select: 'Selecionar',
                finish: 'Concluir',
                linked: function (d, t) { return d + ' de ' + t + ' arquivos vinculados'; },
                loadingGoogle: ' · carregando Google…',
                allLinked: 'Todos os arquivos vinculados — voltando ao aplicativo…',
                errApis: 'Não foi possível carregar as APIs do Google. Verifique sua conexão e tente novamente.',
                errGis: 'Não foi possível carregar o login do Google. Verifique sua conexão e tente novamente.',
                errSignIn: 'Falha no login do Google: ',
                errNoConfig: 'Configuração de login ausente. Reabra o seletor pelo aplicativo.',
                errCancelled: 'O login do Google foi cancelado ou falhou. Recarregue para tentar novamente.',
                errOpen: 'Não foi possível abrir o seletor: ',
                errStartSignIn: 'Não foi possível iniciar o login do Google: ',
                alreadyLinked: function (n) { return '“' + n + '” já está vinculado.'; },
                notInList: function (n) { return '“' + n + '” não é um dos arquivos do Leadership Tracker.'; },
                wrongFolder: function (n) { return '“' + n + '” está em outra pasta. Escolha o “' + n + '” que está dentro da pasta que você selecionou.'; },
            },
            fr: {
                folderHeading: 'Sélectionnez votre dossier',
                folderIntro: 'Choisissez le dossier Google Drive où les données de votre unité sont stockées.',
                folderWarning: 'Ne partagez ce dossier qu’avec les comptes Google nommés de votre équipe de direction — jamais avec « Toute personne disposant du lien ».',
                openFolder: 'Ouvrir le sélecteur de dossier',
                loading: 'Chargement…',
                filesHeading: 'Reliez les fichiers de votre unité',
                filesIntro: 'Configuration unique pour connecter cet appareil aux données partagées de votre unité.',
                filesWhy: 'Pourquoi un fichier à la fois ? Pour protéger vos informations, Google n’autorise une application à ouvrir que les fichiers que vous choisissez vous-même. Vous accordez donc l’accès à chacun des fichiers de votre unité une fois, ici même — une configuration unique qui prend environ une minute et que vous n’aurez pas à refaire. Touchez « Sélectionner » à côté d’un fichier, choisissez-le, et une coche verte apparaît. Si deux fichiers portent le même nom, choisissez celui qui se trouve dans le dossier que vous avez sélectionné.',
                select: 'Sélectionner',
                finish: 'Terminer',
                linked: function (d, t) { return d + ' sur ' + t + ' fichiers reliés'; },
                loadingGoogle: ' · chargement de Google…',
                allLinked: 'Tous les fichiers reliés — retour à l’application…',
                errApis: 'Échec du chargement des API Google. Vérifiez votre connexion et réessayez.',
                errGis: 'Échec du chargement de la connexion Google. Vérifiez votre connexion et réessayez.',
                errSignIn: 'Échec de la connexion Google : ',
                errNoConfig: 'Configuration de connexion manquante. Rouvrez le sélecteur depuis l’application.',
                errCancelled: 'La connexion Google a été annulée ou a échoué. Rechargez pour réessayer.',
                errOpen: 'Impossible d’ouvrir le sélecteur : ',
                errStartSignIn: 'Impossible de démarrer la connexion Google : ',
                alreadyLinked: function (n) { return '« ' + n + ' » est déjà relié.'; },
                notInList: function (n) { return '« ' + n + ' » n’est pas l’un des fichiers Leadership Tracker.'; },
                wrongFolder: function (n) { return '« ' + n + ' » se trouve dans un autre dossier. Choisissez le « ' + n + ' » qui est dans le dossier que vous avez sélectionné.'; },
            },
        };

        function log(m) { console.log('[picker]', m); }

        function getHashParams() {
            var hash = window.location.hash.substring(1);
            var params = {};
            hash.split('&').forEach(function(pair) {
                var idx = pair.indexOf('=');
                if (idx > 0) { params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1)); }
            });
            return params;
        }
        function csv(s) { return (s || '').split(',').map(function(x){return x.trim();}).filter(Boolean); }

        // Reset every possible scroll root — window.scrollTo alone doesn't always
        // move the element the Picker anchors to.
        function scrollTop() {
            try {
                window.scrollTo(0, 0);
                if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
            } catch (e) { /* ignore */ }
        }

        function showError(msg) {
            var el = document.getElementById('error');
            el.textContent = msg; el.style.display = 'block';
        }

        function redirectToApp(params) {
            var query = Object.keys(params).map(function(k) {
                return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }).join('&');
            window.location.href = APP_SCHEME + '://folder?' + query;
        }

        window.addEventListener('error', function(e) { log('window error: ' + (e.message || e)); });
        window.addEventListener('unhandledrejection', function(e) { var r = e.reason; log('promise rejection: ' + (r && r.message ? r.message : JSON.stringify(r))); });

        var hashParams = getHashParams();
        var mode = hashParams.mode === 'files' ? 'files' : 'folder';
        // ⚠️ Do NOT name this `parent` — a global `var parent` clobbers
        // window.parent, which gapi's iframe RPC posts to, crashing the Picker.
        var parentFolderId = hashParams.parent || null;
        var accessToken = hashParams.token || null;
        var loginHint = hashParams.loginHint || null;
        var needNames = csv(hashParams.need);   // files to acquire (Select button)
        var haveNames = csv(hashParams.have);   // files already linked (shown ✓)
        if (hashParams.clientId) { document.getElementById('clientId').value = hashParams.clientId; }

        // Active language catalog (app passes lang=en|es|pt|fr; fall back to en).
        var lang = (hashParams.lang || 'en').slice(0, 2).toLowerCase();
        var L = STRINGS[lang] || STRINGS.en;

        var pickerReady = false, gisReady = false, tokenClient = null;
        var picked = {};   // filename -> { id, name }

        // ---- token (acquired once; reused for every per-file picker open) ----
        function ensureToken(cb) {
            if (accessToken) { cb(); return; }
            var clientId = document.getElementById('clientId').value.trim();
            if (!clientId) { showError(L.errNoConfig); return; }
            try {
                if (!tokenClient) {
                    var cfg = {
                        client_id: clientId,
                        scope: DRIVE_SCOPE,
                        callback: function(resp) {
                            if (resp.error) { showError(L.errSignIn + resp.error); return; }
                            accessToken = resp.access_token;
                            log('token acquired (' + (accessToken ? accessToken.length : 0) + ' chars)');
                            cb();
                        },
                        error_callback: function(err) { showError(L.errCancelled); log('GIS error_callback: ' + JSON.stringify(err)); },
                    };
                    // login_hint pre-selects the account and (when the browser
                    // carries the session) skips the chooser on every open.
                    if (loginHint) { cfg.login_hint = loginHint; }
                    tokenClient = google.accounts.oauth2.initTokenClient(cfg);
                }
                log('requesting token…' + (loginHint ? ' (login_hint set)' : ''));
                tokenClient.requestAccessToken({ prompt: '' });
            } catch (e) {
                showError(L.errStartSignIn + (e && e.message ? e.message : e));
            }
        }

        // ================= FOLDER MODE =================
        function setupFolderMode() {
            document.getElementById('heading').textContent = L.folderHeading;
            document.getElementById('intro').textContent = L.folderIntro;
            var warn = document.getElementById('folderWarning');
            warn.textContent = L.folderWarning; warn.style.display = 'block';
            var b = document.getElementById('go');
            b.textContent = L.loading;
            b.style.display = 'block';
            function enable() {
                if (!pickerReady || !gisReady) return;
                b.disabled = false; b.textContent = L.openFolder;
                b.onclick = function() { ensureToken(openFolderPicker); };
            }
            window.__enable = enable;
        }
        function openFolderPicker() {
            try {
                var view = new google.picker.DocsView().setIncludeFolders(true).setSelectFolderEnabled(true);
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action === google.picker.Action.CANCEL) { redirectToApp({ cancelled: '1' }); return; }
                        if (data.action !== google.picker.Action.PICKED) return;
                        var doc = data.docs[0];
                        if (doc && doc.mimeType === FOLDER_MIME) { redirectToApp({ id: doc.id, name: doc.name }); }
                    });
                picker.build().setVisible(true);
            } catch (e) { showError(L.errOpen + (e && e.message ? e.message : e)); }
        }

        // ================= FILES MODE (per-file checklist) =================
        function setupFilesMode() {
            document.getElementById('heading').textContent = L.filesHeading;
            document.getElementById('intro').textContent = L.filesIntro;
            var why = document.getElementById('filesWhy');
            why.textContent = L.filesWhy; why.style.display = 'block';
            document.getElementById('progress').style.display = 'block';
            document.getElementById('finishBtn').textContent = L.finish;
            renderList();
            updateProgress();
            document.getElementById('finishBtn').onclick = finish;
            window.__enable = function() { renderList(); }; // re-enable Select buttons once ready
        }

        function ready() { return pickerReady && gisReady; }

        function renderList() {
            var list = document.getElementById('fileList');
            list.innerHTML = '';
            // Already-linked files first (informational ✓), then the ones to pick.
            haveNames.forEach(function(name) { list.appendChild(row(name, true, false)); });
            needNames.forEach(function(name) { list.appendChild(row(name, !!picked[name], true)); });
        }
        function row(name, done, actionable) {
            var div = document.createElement('div');
            div.className = 'fileRow' + (done ? ' done' : '');
            var label = document.createElement('span');
            label.className = 'fileName'; label.textContent = name;
            div.appendChild(label);
            if (done) {
                var chk = document.createElement('span');
                chk.className = 'fileStatus'; chk.textContent = '✓';
                div.appendChild(chk);
            } else if (actionable) {
                var btn = document.createElement('button');
                btn.className = 'selectBtn'; btn.textContent = L.select;
                btn.disabled = !ready();
                btn.onclick = function() { scrollTop(); ensureToken(function() { openFilePicker(name); }); };
                div.appendChild(btn);
            }
            return div;
        }

        function updateProgress() {
            var done = needNames.filter(function(n) { return !!picked[n]; }).length;
            var total = needNames.length;
            var p = document.getElementById('progress');
            var allDone = done >= total && total > 0;
            p.textContent = allDone
                ? L.allLinked
                : L.linked(done, total) + (ready() ? '' : L.loadingGoogle);
            if (allDone) {
                document.getElementById('finishBtn').style.display = 'block';
                // Auto-return shortly after the last pick (manual Finish as backup).
                setTimeout(finish, 900);
            }
        }

        // Record a confirmed pick (right name, right folder).
        function acceptPick(doc) {
            var nm = doc.name;
            if (needNames.indexOf(nm) === -1) { alert(L.notInList(nm)); return; }
            if (picked[nm] || haveNames.indexOf(nm) !== -1) { alert(L.alreadyLinked(nm)); return; }
            picked[nm] = { id: doc.id, name: nm };
            log('linked ' + nm);
            renderList();
            updateProgress();
        }
        function rejectWrongFolder(nm) { alert(L.wrongFolder(nm)); }
        // Confirm the picked file lives in the selected folder. Prefer the
        // Picker's parentId; if it isn't provided, verify via the Drive API
        // (the app can read a just-picked file under drive.file).
        function checkParentThenAccept(doc) {
            if (!parentFolderId) { acceptPick(doc); return; }
            if (doc.parentId) {
                if (doc.parentId === parentFolderId) acceptPick(doc); else rejectWrongFolder(doc.name);
                return;
            }
            fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(doc.id) + '?fields=parents&supportsAllDrives=true', {
                headers: { Authorization: 'Bearer ' + accessToken },
            }).then(function(r) { return r.json(); }).then(function(meta) {
                var parents = (meta && meta.parents) || [];
                if (parents.indexOf(parentFolderId) !== -1) acceptPick(doc); else rejectWrongFolder(doc.name);
            }).catch(function() { acceptPick(doc); }); // can't verify → trust the location
        }

        function openFilePicker(name) {
            try {
                // Reset scroll first — the Picker anchors to the scroll position
                // and its top gets clipped on a tall (scrolled) page.
                scrollTop();
                // Filter to this filename (setQuery). NOTE: the Picker search is a
                // GLOBAL, literal word "contains" — it ignores setParent and
                // operators, so the same name from another folder can appear; the
                // parent check below rejects a wrong-folder pick. LIST mode shows
                // the full filename (name only on mobile — accepted).
                var view = new google.picker.DocsView(google.picker.ViewId.DOCS)
                    .setMimeTypes('application/json')
                    .setQuery(name)
                    .setIncludeFolders(false).setSelectFolderEnabled(false);
                if (google.picker.DocsViewMode && google.picker.DocsViewMode.LIST) {
                    view.setMode(google.picker.DocsViewMode.LIST);
                }
                var picker = new google.picker.PickerBuilder()
                    .setAppId(APP_ID).setOAuthToken(accessToken).setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        if (data.action !== google.picker.Action.PICKED) return; // CANCEL → stay on checklist
                        var doc = (data.docs || [])[0];
                        if (doc) checkParentThenAccept(doc);
                    });
                picker.build().setVisible(true);
                // The Picker can re-scroll the page as it injects its overlay;
                // pin it back to the top once that settles.
                setTimeout(scrollTop, 60);
                setTimeout(scrollTop, 250);
            } catch (e) { showError(L.errOpen + (e && e.message ? e.message : e)); }
        }

        function finish() {
            var files = needNames.filter(function(n){ return !!picked[n]; }).map(function(n){ return picked[n]; });
            redirectToApp({ files: JSON.stringify(files) });
        }

        // ---- bootstrap ----
        if (mode === 'files') { setupFilesMode(); } else { setupFolderMode(); }

        var s1 = document.createElement('script');
        s1.src = 'https://apis.google.com/js/api.js';
        s1.onload = function() { log('api.js loaded'); gapi.load('picker', function() { log('picker module loaded'); pickerReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); }); };
        s1.onerror = function() { showError(L.errApis); };
        document.body.appendChild(s1);

        var s2 = document.createElement('script');
        s2.src = 'https://accounts.google.com/gsi/client';
        s2.onload = function() { log('GIS loaded'); gisReady = true; if (window.__enable) window.__enable(); updateProgressSafe(); };
        s2.onerror = function() { showError(L.errGis); };
        document.body.appendChild(s2);

        function updateProgressSafe() { if (mode === 'files') updateProgress(); }
    </script>
</body>
</html>
