<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Tracker — Picker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 680px; margin: 0 auto; color: #222; }
        h2 { margin-bottom: 4px; }
        .intro { color: #555; margin: 8px 0 16px; line-height: 1.5; }
        .btn { background: #1a73e8; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 16px; min-width: 240px; }
        .btn:disabled { background: #bbb; cursor: default; }
        #debug { background: #1e1e1e; color: #9cdcfe; font-size: 12px; line-height: 1.6; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; margin-top: 20px; min-height: 40px; }
    </style>
</head>
<body>
    <h2 id="heading">Leadership Tracker</h2>
    <p class="intro" id="intro"></p>
    <!-- clientId comes from the URL hash; kept as a hidden input so onGo reads it
         exactly like the working diagnostic page (which read from this input). -->
    <input id="clientId" type="hidden" />
    <button id="go" class="btn" disabled>Loading Google APIs…</button>
    <pre id="debug"></pre>

    <script>
        // Public, referrer-restricted values (the API key only works from
        // leadershiptracker.app). 🔒 Scope LOCKED to drive.file.
        var API_KEY = 'AIzaSyCk-uLXVKMSJaEoW68CDebB8GWi86Am-t8';
        var APP_ID = '537892786449';
        var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        var APP_SCHEME = 'com.bshapiro.leadershiptracker';
        var FOLDER_MIME = 'application/vnd.google-apps.folder';

        function dbg(m) {
            var el = document.getElementById('debug');
            el.textContent += m + '\n';
            console.log('[picker]', m);
        }

        function getHashParams() {
            var hash = window.location.hash.substring(1);
            var params = {};
            hash.split('&').forEach(function(pair) {
                var idx = pair.indexOf('=');
                if (idx > 0) { params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1)); }
            });
            return params;
        }

        function redirectToApp(params) {
            var query = Object.keys(params).map(function(k) {
                return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
            }).join('&');
            window.location.href = APP_SCHEME + '://folder?' + query;
        }

        window.addEventListener('error', function(e) {
            dbg('⚠ window error: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function(e) {
            var r = e.reason;
            dbg('⚠ promise rejection: ' + (r && r.message ? r.message : JSON.stringify(r)));
        });

        var hashParams = getHashParams();
        var mode = hashParams.mode === 'files' ? 'files' : 'folder';
        var parent = hashParams.parent || null;
        document.getElementById('clientId').value = hashParams.clientId || '';
        document.getElementById('heading').textContent = mode === 'files' ? 'Select Your Files' : 'Select Your Folder';
        document.getElementById('intro').textContent = mode === 'files'
            ? 'Select all eight Leadership Tracker files in your shared folder.'
            : 'Choose the Google Drive folder where your unit data is stored.';

        var pickerReady = false, gisReady = false, tokenClient = null, accessToken = null;
        function maybeEnable() {
            if (pickerReady && gisReady) {
                var b = document.getElementById('go');
                b.disabled = false;
                b.textContent = mode === 'files' ? 'Open File Picker' : 'Open Folder Picker';
                b.onclick = onGo;
            }
        }

        dbg('origin=' + window.location.origin + ' mode=' + mode);

        var s1 = document.createElement('script');
        s1.src = 'https://apis.google.com/js/api.js';
        s1.onload = function() { dbg('api.js loaded'); gapi.load('picker', function() { dbg('picker module loaded'); pickerReady = true; maybeEnable(); }); };
        s1.onerror = function() { dbg('⚠ api.js failed to load'); };
        document.body.appendChild(s1);

        var s2 = document.createElement('script');
        s2.src = 'https://accounts.google.com/gsi/client';
        s2.onload = function() { dbg('GIS loaded'); gisReady = true; maybeEnable(); };
        s2.onerror = function() { dbg('⚠ GIS failed to load'); };
        document.body.appendChild(s2);

        function onGo() {
            var clientId = document.getElementById('clientId').value.trim();
            if (!clientId) { dbg('⚠ missing clientId — reopen from the app'); return; }
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: DRIVE_SCOPE,
                    callback: function(resp) {
                        if (resp.error) { dbg('⚠ token error: ' + resp.error); return; }
                        accessToken = resp.access_token;
                        dbg('token acquired (' + (accessToken ? accessToken.length : 0) + ' chars)');
                        openPicker();
                    },
                    error_callback: function(err) { dbg('⚠ GIS error_callback: ' + JSON.stringify(err)); },
                });
                dbg('requesting token…');
                tokenClient.requestAccessToken({ prompt: '' });
            } catch (e) {
                dbg('⚠ initTokenClient threw: ' + (e && e.message ? e.message : e));
            }
        }

        function openPicker() {
            try {
                dbg('building picker…');
                var view;
                if (mode === 'files') {
                    view = new google.picker.DocsView(google.picker.ViewId.DOCS)
                        .setParent(parent).setMimeTypes('application/json')
                        .setIncludeFolders(false).setSelectFolderEnabled(false);
                } else {
                    view = new google.picker.DocsView().setIncludeFolders(true).setSelectFolderEnabled(true);
                }
                var builder = new google.picker.PickerBuilder()
                    .setAppId(APP_ID)
                    .setOAuthToken(accessToken)
                    .setDeveloperKey(API_KEY)
                    .setOrigin(window.location.protocol + '//' + window.location.host)
                    .addView(view)
                    .setCallback(function(data) {
                        dbg('callback action=' + data.action + (data.docs ? ' docs=' + data.docs.length : ''));
                        if (data.action !== google.picker.Action.PICKED) return;
                        if (mode === 'files') {
                            var files = (data.docs || []).map(function(d) { return { id: d.id, name: d.name }; });
                            redirectToApp({ files: JSON.stringify(files) });
                        } else {
                            var doc = data.docs[0];
                            if (doc && doc.mimeType === FOLDER_MIME) { redirectToApp({ id: doc.id, name: doc.name }); }
                        }
                    });
                if (mode === 'files') { builder.enableFeature(google.picker.Feature.MULTISELECT_ENABLED); }
                var picker = builder.build();
                dbg('setVisible(true) — watch the Network tab now');
                picker.setVisible(true);
                dbg('picker shown');
            } catch (e) {
                dbg('⚠ openPicker threw: ' + (e && e.message ? e.message : e));
            }
        }
    </script>
</body>
</html>
